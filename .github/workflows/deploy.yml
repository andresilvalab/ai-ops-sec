name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://andresilvalab.com/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # o IndexNow compara com o commit anterior para saber que artigos mudaram
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:private
      - run: npm run build
        env:
          SITE_URL: https://andresilvalab.com
          BASE_PATH: /
      - name: Deploy para Cloudflare Workers (static assets)
        uses: cloudflare/wrangler-action@25853364521e0d392ece9b0c1e97a4b37b638087 # v4.1.2
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verificar cabeçalhos no ar
        run: |
          set -e
          sleep 20
          H=$(curl -sI https://andresilvalab.com/)
          for h in content-security-policy strict-transport-security x-content-type-options referrer-policy permissions-policy cross-origin-opener-policy; do
            echo "$H" | grep -qi "^$h:" || { echo "falta cabeçalho $h"; exit 1; }
          done
          curl -s -o /dev/null -w 'security.txt %{http_code}\n' https://andresilvalab.com/.well-known/security.txt | grep -q 200
          echo "cabeçalhos e security.txt OK"
      - name: IndexNow (avisar os índices dos URLs que mudaram)
        env:
          BEFORE: ${{ github.event.before }}
        run: node scripts/indexnow.mjs "$BEFORE"
