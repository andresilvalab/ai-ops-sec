name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Marcadores privados (caminhos, tokens)
        run: npm run check:private
      - name: Segredos no histórico (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (URL de produção)
        run: npm run build
        env:
          SITE_URL: https://andresilvalab.com
          BASE_PATH: /
      - name: CSP coerente (meta vs _headers)
        run: npm run check:csp
      - name: security.txt válido (Expires > 30 dias)
        run: npm run check:security-txt
      - name: Ficheiros obrigatórios no output
        run: |
          set -e
          for f in index.html en/index.html rss.xml en/rss.xml llms.txt llms-full.txt agents.md agent-index.json .well-known/mcp.json robots.txt sitemap-index.xml security.txt _headers pagefind/pagefind.js og/default-pt.png; do
            test -f "dist/$f" || { echo "falta dist/$f"; exit 1; }
          done
          echo "output completo"
